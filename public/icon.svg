<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with safe zone rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="216" stroke="url(#primaryGrad)" stroke-width="6" fill="none" opacity="0.3" stroke-dasharray="12 12" />

  <!-- Alarm Bell with Pulse Wave -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Sound Waves -->
    <path d="M-130,-40 C-150,-10 -150,50 -130,80" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" opacity="0.8" />
    <path d="M130,-40 C150,-10 150,50 130,80" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.8" />

    <!-- Alarm Bell Body -->
    <path d="M0,-110 C-10,-110 -16,-102 -16,-92 C-16,-85 -10,-80 -4,-78 C-50,-68 -80,-30 -80,30 L-95,65 C-98,72 -92,80 -84,80 L84,80 C92,80 98,72 95,65 L80,30 C80,-30 50,-68 4,-78 C10,-80 16,-85 16,-92 C16,-102 10,-110 0,-110 Z" fill="url(#bellGrad)" />

    <!-- Bell Clapper -->
    <path d="M-26,88 C-24,106 24,106 26,88 Z" fill="#38bdf8" />

    <!-- Fitness Pulse Lightning in Bell Center -->
    <path d="M-28,10 L-6,10 L-14,35 L26,-10 L5,-10 L15,-35 Z" fill="#0f172a" />
  </g>
</svg>
